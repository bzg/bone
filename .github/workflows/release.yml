name: Release uberjar

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Cache deps
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('deps.edn') }}

      - name: Compile AOT
        run: |
          mkdir -p classes
          clojure -M -e "(compile 'bone.main)"

      - name: Build uberjar
        run: clojure -M:uberdeps --main-class bone.main

      - name: Create release with jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" target/bone.jar --generate-notes
